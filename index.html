<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TYT Biyoloji Bilgi Kartları - Set 2</title>
    
    <!-- Tailwind CSS for Styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React and Babel for In-Browser Rendering -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        .perspective-1000 { perspective: 1000px; }
        .preserve-3d { transform-style: preserve-3d; }
        .backface-hidden { backface-visibility: hidden; }
        .rotate-y-180 { transform: rotateY(180deg); }
        
        /* Smooth transitions for card flip */
        .card-inner {
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // Yeni Soru Seti (Set 2 - Önceki sorulardan farklı)
        const rawData = [
            { q: "Proteinlerin temel yapı taşlarına ne ad verilir?", a: "Amino asit" },
            { q: "Bitki hücrelerinde fazla glikozun depolandığı polisakkarit türü nedir?", a: "Nişasta" },
            { q: "Hücrenin enerji santrali olarak bilinen ve ATP üretilen organel hangisidir?", a: "Mitokondri" },
            { q: "Protein sentezinin gerçekleştiği zarsız organel hangisidir?", a: "Ribozom" },
            { q: "Maddelerin az yoğun ortamdan çok yoğun ortama enerji harcanarak taşınmasına ne denir?", a: "Aktif Taşıma" },
            { q: "Bitki hücrelerini hayvan hücrelerinden ayıran temel dış yapı nedir?", a: "Hücre Çeperi" },
            { q: "Canlıların kalıtsal bilgilerini taşıyan ve yönetici molekül olan yapı hangisidir?", a: "DNA" },
            { q: "ATP'nin yapısında bulunan beş karbonlu şeker hangisidir?", a: "Riboz" },
            { q: "Sadece bitki hücrelerinde bulunan, fotosentezin gerçekleştiği organel hangisidir?", a: "Kloroplast" },
            { q: "Hücre içi sindirimden sorumlu olan ve parçalayıcı enzimler içeren organel hangisidir?", a: "Lizozom" },
            { q: "Belirli bir bölgede yaşayan aynı türe ait bireylerin oluşturduğu topluluğa ne denir?", a: "Popülasyon" },
            { q: "Besin zincirinde üreticiden tüketiciye doğru gidildikçe aktarılan enerji miktarı nasıl değişir?", a: "Azalır" },
            { q: "Bir canlının dış görünüşünde ortaya çıkan özelliklere ne denir?", a: "Fenotip" },
            { q: "Mendel yasalarına göre bir canlının sahip olduğu genlerin tamamına ne ad verilir?", a: "Genotip" },
            { q: "Mantarların hücre duvarını oluşturan azotlu polisakkarit nedir?", a: "Kitin" },
            { q: "Suyun molekülleri arasındaki çekim kuvveti sayesinde birbirini tutmasına ne denir?", a: "Kohezyon" },
            { q: "Enzimlerin protein kısmına ne ad verilir?", a: "Apoenzim" },
            { q: "Omurgalı hayvanların tamamında görülen ortak iskelet yapısı nedir?", a: "İç iskelet" },
            { q: "Kan gruplarının belirlenmesinde alyuvarların zarında bulunan proteinlere ne denir?", a: "Antijen" },
            { q: "Fotosentezde ışık enerjisini soğuran pigment hangisidir?", a: "Klorofil" },
            { q: "Bakterilerin DNA'larını eşleyerek ikiye bölünmesiyle gerçekleşen üreme tipi nedir?", a: "Eşeysiz üreme (Bölünme)" },
            { q: "Hücre zarının yapısını açıklayan güncel modelin adı nedir?", a: "Akıcı Mozaik Zar Modeli" },
            { q: "Glikoz ve fruktozun birleşmesiyle oluşan disakkarit hangisidir?", a: "Sakkaroz (Çay şekeri)" },
            { q: "Hayvan hücrelerinde bulunup hücre bölünmesinde iğ ipliklerini oluşturan organel hangisidir?", a: "Sentrozom" },
            { q: "Bir ekosistemdeki canlı ve cansız etmenlerin bütününe ne ad verilir?", a: "Ekosistem" }
        ];

        function App() {
            const [view, setView] = useState('welcome');
            const [cards, setCards] = useState(rawData);
            const [currentIndex, setCurrentIndex] = useState(0);
            const [isFlipped, setIsFlipped] = useState(false);

            useEffect(() => {
                if (window.lucide) window.lucide.createIcons();
            }, [view, currentIndex, isFlipped]);

            const progress = ((currentIndex + 1) / cards.length) * 100;

            const nextCard = () => {
                if (currentIndex < cards.length - 1) {
                    setIsFlipped(false);
                    setTimeout(() => setCurrentIndex(prev => prev + 1), 50);
                }
            };

            const prevCard = () => {
                if (currentIndex > 0) {
                    setIsFlipped(false);
                    setTimeout(() => setCurrentIndex(prev => prev - 1), 50);
                }
            };

            const shuffleCards = () => {
                const shuffled = [...cards].sort(() => Math.random() - 0.5);
                setCards(shuffled);
                setCurrentIndex(0);
                setIsFlipped(false);
            };

            if (view === 'welcome') {
                return (
                    <div className="min-h-screen flex items-center justify-center p-6">
                        <div className="w-full max-w-xl bg-white rounded-3xl shadow-2xl p-8 md:p-12 text-center border border-slate-100">
                            <div className="inline-flex p-4 bg-emerald-100 text-emerald-600 rounded-2xl mb-6">
                                <i data-lucide="graduation-cap" style={{width: 48, height: 48}}></i>
                            </div>
                            <h1 className="text-3xl md:text-4xl font-black text-slate-800 mb-4 tracking-tight">TYT Biyoloji - Bilgi  Kartları</h1>
                            <p className="text-slate-500 text-lg mb-8">Organeller, Kalıtım ve Ekoloji gibi konulardan seçilmiş 25 yeni kavramı tekrar et.</p>
                            <button 
                                onClick={() => setView('quiz')}
                                className="w-full py-4 bg-emerald-600 hover:bg-emerald-700 text-white rounded-2xl font-bold text-lg transition-all shadow-lg flex items-center justify-center gap-2 group"
                            >
                                Başla <i data-lucide="play" style={{width: 20, height: 20}}></i>
                            </button>
                        </div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen flex flex-col items-center p-4 md:p-8">
                    <header className="w-full max-w-2xl flex flex-col gap-4 mb-8">
                        <div className="flex items-center justify-between">
                            <div className="flex items-center gap-2">
                                <button onClick={() => setView('welcome')} className="p-2 bg-emerald-600 rounded-lg text-white"><i data-lucide="book-open"></i></button>
                                <div>
                                    <h1 className="text-xl font-bold text-slate-800">TYT Biyoloji-MEB 2018 Müfredatı.</h1>
                                    <p className="text-sm text-slate-500">[Tasarım: Naci Karhan]</p>
                                </div>
                            </div>
                            <div className="flex gap-2">
                                <button onClick={shuffleCards} className="p-2 text-slate-600" title="Karıştır"><i data-lucide="shuffle"></i></button>
                                <button onClick={() => {setCards(rawData); setCurrentIndex(0); setView('welcome');}} className="p-2 text-slate-600" title="Sıfırla"><i data-lucide="rotate-ccw"></i></button>
                            </div>
                        </div>
                        <div className="h-2 w-full bg-slate-200 rounded-full overflow-hidden">
                            <div className="h-full bg-emerald-500 transition-all duration-300" style={{ width: `${progress}%` }}></div>
                        </div>
                    </header>

                    <main className="flex-1 w-full max-w-2xl flex flex-col items-center justify-center gap-8">
                        <div className="relative w-full aspect-[4/3] md:aspect-[16/9] cursor-pointer perspective-1000" onClick={() => setIsFlipped(!isFlipped)}>
                            <div className={`card-inner relative w-full h-full preserve-3d shadow-xl rounded-3xl ${isFlipped ? 'rotate-y-180' : ''}`}>
                                <div className="absolute inset-0 backface-hidden bg-white rounded-3xl p-8 flex flex-col items-center justify-center text-center border-b-4 border-emerald-200">
                                    <span className="text-xs font-bold text-emerald-400 uppercase mb-4 tracking-widest">SORU</span>
                                    <p className="text-xl md:text-2xl font-medium text-slate-700 px-4 leading-relaxed">{cards[currentIndex].q}</p>
                                    <div className="absolute bottom-6 flex items-center gap-2 text-slate-300 text-xs italic">
                                        Cevap için tıkla
                                    </div>
                                </div>
                                <div className="absolute inset-0 backface-hidden bg-emerald-600 rounded-3xl p-8 flex flex-col items-center justify-center text-center rotate-y-180 text-white">
                                    <span className="text-xs font-bold text-emerald-200 uppercase mb-4 tracking-widest">CEVAP</span>
                                    <p className="text-2xl md:text-3xl font-bold px-4">{cards[currentIndex].a}</p>
                                </div>
                            </div>
                        </div>

                        <div className="flex items-center gap-6">
                            <button onClick={prevCard} disabled={currentIndex === 0} className="p-4 bg-white rounded-2xl shadow-md disabled:opacity-50 hover:bg-slate-50 transition-colors"><i data-lucide="chevron-left" className="text-emerald-600"></i></button>
                            <div className="flex flex-col items-center min-w-[80px]">
                                <span className="text-xs font-bold text-slate-400 uppercase">KART</span>
                                <span className="text-xl font-bold text-slate-800">{currentIndex + 1} / 25</span>
                            </div>
                            <button onClick={nextCard} disabled={currentIndex === cards.length - 1} className="p-4 bg-white rounded-2xl shadow-md disabled:opacity-50 hover:bg-slate-50 transition-colors"><i data-lucide="chevron-right" className="text-emerald-600"></i></button>
                        </div>
                    </main>

                    <footer className="mt-8 text-slate-400 text-xs text-center italic">
                        Bilgi: Space tuşu ile kartı çevirebilir, ok tuşları ile gezinebilirsiniz.
                    </footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
